name: Docker Build -> Docker Hub + AWS ECR -> Gitops (release)

on:
  workflow_call:
    inputs:
      name:
        description: Friendly name of the app
        type: string
        required: true
      docker-name:
        description: Name of the docker image
        type: string
        required: true
      docker-file:
        description: Location of Dockerfile
        type: string
        default: deploy/kubernetes/docker/Dockerfile
      docker-platforms:
        description: Docker build platforms
        type: string
        default: linux/amd64
      static-assets:
        description: Extract the built dist from the image and upload it to S3 (served via CDN)
        type: boolean
        default: false
      static-assets-bucket:
        description: S3 bucket for static assets (e.g. static.ovatu.com)
        type: string
        default: ''
      static-assets-prefix:
        description: Key prefix / property name (e.g. manager-app); assets land at <prefix>/<tag>
        type: string
        default: ''
      static-assets-target:
        description: Dockerfile stage to export (optional; just makes the export lean). Leave blank to export the full image rootfs.
        type: string
        default: assets
      static-assets-path:
        description: Path to the built assets within the exported rootfs (required when static-assets is enabled)
        type: string
      helm-chart:
        description: Location of helm charts
        type: string
      gitops-repo:
        description: Repo for gitops
        type: string
        required: true
      gitops-name:
        description: Name of the gitops app
        type: string
        required: true
      gitops-values-script:
        description: Script to run during gitops (update values.yaml)
        type: string
    secrets:
      AWS_ASSUME_ROLE:
        required: true
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_PASSWORD:
        required: true
      GITOPS_REPO_PRIVATE_KEY:
        required: true
      GITHUB_REPOS_PAT:
        required: false
      SLACK_WEBHOOK_URL:
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set variables
      id: variables
      run: |
        echo "repo=${{ inputs.docker-name }}" >> $GITHUB_OUTPUT
        echo "tag=release-${{ github.ref_name }}" >> $GITHUB_OUTPUT
        echo "release=${{ github.ref_name }}" >> $GITHUB_OUTPUT

        # Exposed to the caller's gitops-values-script as strenv(STATIC_ASSETS_CDN)
        # so each app maps it into its own values schema. Kept scheme-less:
        # consumers (e.g. helm printf "https://%s/") add the scheme.
        CDN=""
        if [ -n "${{ inputs.static-assets-bucket }}" ]; then
          CDN="${{ inputs.static-assets-bucket }}/${{ inputs.static-assets-prefix }}/release-${{ github.ref_name }}"
        fi
        echo "STATIC_ASSETS_CDN=$CDN" >> $GITHUB_ENV

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker
      id: docker-login
      uses: ovatu/actions/.github/actions/docker-login@main
      with:
        docker-hub-username: ${{ secrets.DOCKER_HUB_USERNAME }}
        docker-hub-password: ${{ secrets.DOCKER_HUB_PASSWORD }}
        aws-assume-role: ${{ secrets.AWS_ASSUME_ROLE }}

    - name: Build and push
      uses: docker/build-push-action@v3
      with:
        driver: docker
        file: deploy/kubernetes/docker/Dockerfile
        platforms: ${{ inputs.docker-platforms }}
        push: true
        tags: |
          ${{ steps.variables.outputs.repo }}:${{ steps.variables.outputs.tag }}
          ${{ steps.docker-login.outputs.ecr-registry }}/${{ steps.variables.outputs.repo }}:${{ steps.variables.outputs.tag }}
        build-args: |
          VERSION=${{ steps.variables.outputs.tag }}
        secrets: |
          "github_token=${{ secrets.GITHUB_REPOS_PAT }}"

    - name: Export static assets
      if: inputs.static-assets
      uses: docker/build-push-action@v3
      with:
        file: ${{ inputs.docker-file }}
        target: ${{ inputs.static-assets-target }}
        outputs: type=local,dest=./__static_assets
        build-args: |
          VERSION=${{ steps.variables.outputs.tag }}
        secrets: |
          "github_token=${{ secrets.GITHUB_REPOS_PAT }}"

    - name: Upload static assets to S3
      if: inputs.static-assets
      env:
        DEST: s3://${{ inputs.static-assets-bucket }}/${{ inputs.static-assets-prefix }}/${{ steps.variables.outputs.tag }}
      run: |
        if [ -z "${{ inputs.static-assets-path }}" ]; then
          echo "static-assets-path is required when static-assets is enabled" >&2
          exit 1
        fi
        # Assets are content-hashed and land under a per-build prefix, so the
        # whole dir is immutable. index.html rides along unused (the pod serves it).
        aws s3 sync "./__static_assets${{ inputs.static-assets-path }}" "$DEST" \
          --cache-control "public,max-age=31536000,immutable"

    - name: Gitops
      uses: ovatu/actions/.github/actions/gitops-release@main
      with:
        name: ${{ inputs.gitops-name }}-release
        repository: ${{ inputs.gitops-repo }}
        repository-ssh-key: ${{ secrets.GITOPS_REPO_PRIVATE_KEY }}
        input-directory: ${{ inputs.helm-chart }}
        output-directory: apps/${{ inputs.gitops-name }}/release
        message: "[Actions][Build] repo:${{ inputs.gitops-name }}, release: ${{ steps.variables.outputs.release }}"
        values-script: |
          echo "BEGIN writing values"
          yq -i '.appVersion = "${{ steps.variables.outputs.tag }}"' Chart.yaml
          yq -i '.image.repository = "${{ steps.docker-login.outputs.ecr-registry }}/${{ steps.variables.outputs.repo }}"' values.yaml
          yq -i '.image.tag = "${{ steps.variables.outputs.tag }}"' values.yaml
          echo "DONE writing values"

          echo "BEGIN inputs.gitops-values-script"
          ${{ inputs.gitops-values-script }}
          echo "BEGIN inputs.gitops-values-script"

    - name: Send Slack webhook
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "Released: ${{ inputs.name }}, v: ${{ steps.variables.outputs.release }}",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "Released: ${{ inputs.name }}, v: ${{ steps.variables.outputs.release }}"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ${{ toJson(github.event.release.body || 'No release notes') }}
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "*App:* ${{ inputs.gitops-name }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Version:* ${{ steps.variables.outputs.tag }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Repo:* ${{ github.repository }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Tag:* ${{ github.ref_name }}"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
